[script_image]
type = image
path = /SitckTrackerX.png

[label_model_detection]
type = label
label = MODEL & DETECTION
color = white
bg = red

[model_selection]
type = dropdown
label = Model Selection
default = v8_AIOv10.onnx
value = WZ_50K_V2_320.onnx
options = PHIAI_100K.onnx, WZ_50K_V2_320.onnx

[conf_thres]
type = slider
label = Confidence Threshold
default = 0.70
value = 0.41
min = 0.01
max = 1.00
step = 0.01

[iou_thres]
type = slider
label = IoU Threshold
default = 0.50
value = 0.61
min = 0.01
max = 1.00
step = 0.01

[label_pid]
type = label
label = AIM SMOOTHING (PID)
color = white
bg = red

[pid_kp]
type = slider
label = Aim Sensitivity (Kp)
default = 0.45
value = 1.28
min = 0.0
max = 2.0
step = 0.01

[pid_ki]
type = slider
label = Aim Steadiness (Ki)
default = 0.01
value = 0.0
min = 0.0
max = 1.0
step = 0.01

[pid_kd]
type = slider
label = Aim Reaction (Kd)
default = 0.25
value = 0.5
min = 0.0
max = 1.0
step = 0.01

[Settings_label]
type = label
label = SETTINGS AIM ASSIST AVANCED
color = white
bg = red

[fov_size]
type = slider
label = FOV Size
default = 100
value = 100
min = 50
max = 240
step = 10

[activation_mode]
type = dropdown
label = Activation Mode
default = ADS Only
value = ADS or Shoot
options = ADS or Shoot, ADS Only, Shoot Only, Always On

[speed_profile]
type = dropdown
label = Speed Profile
default = Flat
value = Far Focus
options = Flat, Hyper Drive, Cruiser, Flick Beast, Tracer, Ying & Yang, Special K, Pop, Ramp, Push, Far Focus, Close Snap, Progressive Slow

[tracking_speed]
type = slider
label = Tracking Speed (ADS)
default = 1
value = 1.5
min = 0.0
max = 7.0
step = 0.01

[tracking_speed_hip]
type = slider
label = Tracking Speed (HIP Fire)
default = 1
value = 0.0
min = 0.0
max = 7.0
step = 0.01

[deadzone]
type = slider
label = Deadzone
default = 0.05
value = 0.0
min = 0.0
max = 0.5
step = 0.01

[target_offset]
type = slider
label = Target Offset
default = 0.70
value = 0.79
min = 0.00
max = 1.00
step = 0.01

[restrict_manual_aiming]
type = slider
label = Restrict Manual Aiming
default = 0.75
value = 0.51
min = 0.01
max = 1
step = 0.01

[label_antirecoil]
type = label
label = ANTI-RECOIL SYSTEM
color = white
bg = red

[anti_recoil]
type = onoff
label = Anti Recoil
default = False
value = True

[anti_recoil_ry_label]
type = label
label = Recoil Vertical (RY)
color = Red
bg = White

[anti_recoil_ry]
type = slider
label = Vertical Strength
default = -0.1
value = -0.11
min = 0.0
max = -1.0
step = 0.01

[anti_recoil_rx_label]
type = label
label = Recoil Horizontal (RX)
color = Red
bg = White

[anti_recoil_rx]
type = slider
label = Horizontal Strength
default = -0.1
value = 0.0
min = 0.0
max = -1.0
step = 0.01

